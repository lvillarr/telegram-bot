<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mejora Continua IA — Arauco</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato',-apple-system,sans-serif;background:#f0ede9;color:#333;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.header{background:#696158;color:#fff;padding:0 24px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.header-left{display:flex;align-items:center;gap:14px}
.logo{height:26px;filter:brightness(0) invert(1);opacity:.9}
.header-title{font-size:.95rem;font-weight:700}
.header-sub{font-size:.72rem;color:rgba(255,255,255,.6);font-weight:300}
.model-selector{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Lato',sans-serif;font-size:.75rem;padding:5px 10px;border-radius:6px;cursor:pointer;outline:none}
.split-toggle{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;margin-left:8px;transition:all .2s}
.split-toggle:hover{background:#BFB800;border-color:#BFB800;color:#333}

.main{display:flex;flex:1;overflow:hidden}

.sidebar{width:220px;background:#fff;border-right:1px solid #e0dbd4;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.new-btn{margin:12px;padding:9px;background:#BFB800;color:#fff;border:none;border-radius:8px;font-family:'Lato',sans-serif;font-weight:700;font-size:.82rem;cursor:pointer}
.new-btn:hover{background:#a8a200}

.chat-container{flex:1;display:grid;grid-template-columns:1fr;overflow:hidden}
.chat-container.split{grid-template-columns:60% 40%}
.chat-wrap{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #e0dbd4}
.chat-container.split .chat-wrap{border-right:1px solid #e0dbd4}

/* Timeline + búsqueda */
.chat-header{padding:12px;border-bottom:1px solid #e0dbd4;display:flex;gap:8px;align-items:center;background:#fafafa}
.search-box{flex:1;display:flex;gap:4px}
.search-box input{flex:1;border:1px solid #ddd;border-radius:6px;padding:6px 10px;font-size:.8rem;outline:none}
.search-box input:focus{border-color:#696158}
.search-btn{padding:6px 12px;background:#696158;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.75rem}

/* Messages area con virtualization ready */
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-thumb{background:#d0c9c0;border-radius:3px}

/* Chat card — expandible */
.chat-card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid #eee;overflow:hidden;transition:all .2s}
.chat-card.user{margin-left:60px;background:#696158;color:#fff}
.chat-card.ai{margin-right:60px}

.card-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;background:#f9f7f5}
.chat-card.ai .card-header{background:#fff}
.chat-card.user .card-header{background:rgba(0,0,0,.1)}
.card-header:hover{background:#f0ede9}
.chat-card.user .card-header:hover{background:rgba(0,0,0,.2)}

.card-title{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.card-title-text{font-size:.82rem;font-weight:700;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-card.user .card-title-text{color:#fff}
.card-agent-tag{display:inline-block;font-size:.6rem;padding:2px 6px;border-radius:3px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.tag-orq{background:#696158;color:#fff}
.tag-eo{background:#EA7600;color:#fff}
.tag-ia{background:#BFB800;color:#333}
.tag-td{background:#DFD1A7;color:#333}
.tag-da{background:#f0ede9;color:#696158;border:1px solid #DFD1A7}

.card-toggle{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;color:#bbb;font-size:1rem;flex-shrink:0;transition:transform .2s}
.chat-card.user .card-toggle{color:#fff}
.card-toggle.expanded{transform:rotate(180deg)}

.card-body{padding:0;max-height:0;overflow:hidden;transition:max-height .3s ease}
.card-body.expanded{max-height:600px;padding:12px 14px;background:#fff;border-top:1px solid #eee}
.chat-card.user .card-body.expanded{background:rgba(0,0,0,.05)}

.card-content{font-size:.85rem;line-height:1.65;color:#333}
.chat-card.user .card-content{color:#fff}
.card-content p{margin:4px 0}
.card-content strong{font-weight:700}
.card-content em{font-style:italic}
.card-content code{background:#f0ede9;padding:1px 4px;border-radius:3px;font-family:monospace;font-size:.8rem}
.chat-card.user .card-content code{background:rgba(0,0,0,.1)}
.card-content h3{font-size:.9rem;font-weight:700;margin:8px 0 4px;border-bottom:1px solid #e0dbd4;padding-bottom:3px}
.card-content table{width:100%;border-collapse:collapse;font-size:.8rem;margin:8px 0}
.card-content th{background:#696158;color:#fff;padding:6px 9px;text-align:left;font-weight:700;text-transform:uppercase;font-size:.72rem}
.card-content td{padding:6px 9px;border-bottom:1px solid #eee}
.card-content tr:nth-child(even) td{background:#f9f7f5}

.card-actions{padding:10px 14px;background:#f9f7f5;border-top:1px solid #eee;display:flex;gap:6px;flex-wrap:wrap}
.card-action-btn{padding:4px 10px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:.75rem;font-family:'Lato',sans-serif;transition:all .1s;color:#555}
.card-action-btn:hover{background:#696158;color:#fff;border-color:#696158}

/* Data panel derecha */
.data-panel{display:flex;flex-direction:column;overflow:hidden;border-left:1px solid #e0dbd4;background:#fafafa}
.data-header{padding:12px;border-bottom:1px solid #e0dbd4;font-weight:700;font-size:.85rem;color:#696158}
.data-content{flex:1;overflow-y:auto;padding:12px}
.data-table{width:100%;border-collapse:collapse;font-size:.75rem;background:#fff}
.data-table th{background:#696158;color:#fff;padding:6px 8px;text-align:left;font-weight:700;text-transform:uppercase}
.data-table td{padding:6px 8px;border-bottom:1px solid #eee}
.data-table tr:hover{background:#f5f2ee}
.data-empty{padding:20px;text-align:center;color:#bbb;font-size:.8rem}

/* Input area */
.input-area{padding:12px 16px;background:#fff;border-top:1px solid #e0dbd4;flex-shrink:0}
.input-box{display:flex;gap:8px;align-items:flex-end;background:#f5f2ee;border:1.5px solid #DFD1A7;border-radius:10px;padding:9px 12px;transition:border-color .15s}
.input-box:focus-within{border-color:#696158}
.input-box textarea{flex:1;border:none;background:transparent;font-family:'Lato',sans-serif;font-size:.86rem;color:#333;resize:none;outline:none;line-height:1.5;max-height:100px;min-height:20px}
.input-box textarea::placeholder{color:#bbb}
.send-btn{width:34px;height:34px;background:#696158;border:none;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s;color:#fff}
.send-btn:hover:not(:disabled){background:#BFB800}
.send-btn:disabled{opacity:.4;cursor:default}
.send-btn svg{width:15px;height:15px;fill:currentColor}

.empty-state{margin:auto;text-align:center;padding:40px 20px;max-width:420px}
.empty-state h2{font-size:1.2rem;font-weight:900;color:#696158;margin-bottom:8px}
.empty-state p{font-size:.85rem;color:#aaa;line-height:1.6}

@media(max-width:900px){
  .chat-container.split{grid-template-columns:1fr}
  .data-panel{display:none}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="https://arauco.com/chile/wp-content/themes/arauco/assets/img/logo-arauco.png" class="logo" onerror="this.style.display='none'">
    <div>
      <div class="header-title">Mejora Continua IA</div>
      <div class="header-sub">Subgerencia MC — Arauco</div>
    </div>
  </div>
  <select class="model-selector" id="modelSelect">
    <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
    <option value="claude-sonnet-4-6">Sonnet 4.6</option>
    <option value="claude-opus-4-8">Opus 4.8</option>
  </select>
  <button class="split-toggle" id="splitToggle" onclick="toggleSplit()">📊 Datos vivos</button>
</div>

<div class="main">
  <div class="sidebar">
    <button class="new-btn" onclick="newChat()">+ Nueva</button>
    <div id="sidebarContent"></div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="chat-wrap">
      <div class="chat-header">
        <input type="text" id="searchBox" placeholder="Buscar en historial..." onkeyup="filterMessages(this.value)">
        <button class="search-btn" onclick="filterMessages(document.getElementById('searchBox').value)">🔍</button>
      </div>
      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <h2>Sistema Multiagente Arauco</h2>
          <p>Orquestador + EO + IA + TD + DA coordinados.<br>Chat expandible, datos vivos, búsqueda full-text.</p>
        </div>
      </div>
      <div class="input-area">
        <div class="input-box">
          <textarea id="input" placeholder="Escribe tu pregunta..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}" rows="1"></textarea>
          <button class="send-btn" id="sendBtn" onclick="send()">
            <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="data-panel" id="dataPanel" style="display:none">
      <div class="data-header">📊 Datos vivos — arauco_mc.db</div>
      <div class="data-content">
        <div class="data-empty">Cargando datos...</div>
      </div>
    </div>
  </div>
</div>

<script>
let history = [];
let streaming = false;
let currentAgent = 'orq';
let splitViewActive = false;
const SESSION_ID = 'web-' + crypto.randomUUID();

const AGENT_CONFIG = {
  orq: {name:'Orquestador', tag:'tag-orq'},
  eo:  {name:'Excelencia Op.', tag:'tag-eo'},
  ia:  {name:'Inteligencia IA', tag:'tag-ia'},
  td:  {name:'Transf. Digital', tag:'tag-td'},
  da:  {name:'Análisis Datos', tag:'tag-da'}
};

function toggleSplit(){
  splitViewActive = !splitViewActive;
  const container = document.getElementById('chatContainer');
  const panel = document.getElementById('dataPanel');
  const btn = document.getElementById('splitToggle');

  if(splitViewActive){
    container.classList.add('split');
    panel.style.display = 'flex';
    btn.style.background = '#BFB800';
    btn.style.color = '#333';
    loadDataPanel();
  } else {
    container.classList.remove('split');
    panel.style.display = 'none';
    btn.style.background = 'rgba(255,255,255,.12)';
    btn.style.color = '#fff';
  }
}

function loadDataPanel(){
  const content = document.querySelector('.data-content');
  content.innerHTML = `<table class="data-table">
    <tr><th>KPI</th><th>Valor</th></tr>
    <tr><td>OEE Global</td><td>87,3%</td></tr>
    <tr><td>Pérdidas hoy</td><td>1.245 m³</td></tr>
    <tr><td>Equipos activos</td><td>24</td></tr>
    <tr><td>Disponibilidad</td><td>92,1%</td></tr>
  </table>`;
}

function newChat(){
  history = [];
  document.getElementById('messages').innerHTML = `
    <div class="empty-state" id="emptyState">
      <h2>Sistema Multiagente Arauco</h2>
      <p>Orquestador + EO + IA + TD + DA coordinados.</p>
    </div>`;
}

function renderCard(role, content, agent='orq'){
  document.getElementById('emptyState')?.remove();
  const msgs = document.getElementById('messages');
  const card = document.createElement('div');
  card.className = `chat-card ${role === 'user' ? 'user' : 'ai'}`;

  if(role === 'user'){
    card.innerHTML = `
      <div class="card-header">
        <div class="card-title"><span class="card-title-text">Luciano</span></div>
      </div>
      <div class="card-body expanded">
        <div class="card-content">${escapeHtml(content).replace(/\n/g,'<br>')}</div>
      </div>`;
  } else {
    const agentCfg = AGENT_CONFIG[agent] || AGENT_CONFIG.orq;
    const summary = content.length > 100 ? content.slice(0,100)+'...' : content;
    card.innerHTML = `
      <div class="card-header" onclick="toggleCard(this)">
        <div class="card-title">
          <span class="card-agent-tag ${agentCfg.tag}">${agentCfg.name}</span>
          <span class="card-title-text">${escapeHtml(summary)}</span>
        </div>
        <button class="card-toggle" onclick="event.stopPropagation()">▼</button>
      </div>
      <div class="card-body">
        <div class="card-content">${escapeHtml(content).replace(/\n/g,'<br>')}</div>
        <div class="card-actions">
          <button class="card-action-btn" onclick="copyCard(this)">📋 Copiar</button>
          <button class="card-action-btn" onclick="expandCard(this)">📖 Expandir</button>
          <button class="card-action-btn" onclick="refineCard(this)">✏️ Refinar</button>
        </div>
      </div>`;
  }

  msgs.appendChild(card);
  msgs.scrollTop = msgs.scrollHeight;
}

function toggleCard(header){
  const body = header.nextElementSibling;
  const toggle = header.querySelector('.card-toggle');
  body.classList.toggle('expanded');
  toggle.classList.toggle('expanded');
}

function copyCard(btn){
  const content = btn.closest('.card-body').querySelector('.card-content').innerText;
  navigator.clipboard.writeText(content).then(()=>{
    btn.textContent = '✓ Copiado';
    setTimeout(()=>btn.textContent='📋 Copiar', 2000);
  });
}

function expandCard(btn){
  alert('Modo expandido: abre card en modal (TODO)');
}

function refineCard(btn){
  const content = btn.closest('.card-body').querySelector('.card-content').innerText;
  document.getElementById('input').value = 'Refina esta respuesta: ' + content.slice(0,50) + '...';
  document.getElementById('input').focus();
}

function filterMessages(q){
  const cards = document.querySelectorAll('.chat-card');
  q = q.toLowerCase();
  cards.forEach(card => {
    const text = card.innerText.toLowerCase();
    card.style.display = text.includes(q) ? 'block' : 'none';
  });
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

async function send(){
  if(streaming) return;
  const text = document.getElementById('input').value.trim();
  if(!text) return;

  streaming = true;
  document.getElementById('input').value = '';
  document.getElementById('sendBtn').disabled = true;

  renderCard('user', text);
  history.push({role:'user', content:text});

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        message: text,
        history: history.slice(0,-1),
        model: document.getElementById('modelSelect').value,
        session_id: SESSION_ID,
        agent: currentAgent
      })
    });

    let fullText = '';
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      fullText += decoder.decode(value, {stream:true});
    }

    // Parse SSE
    fullText.split('\n').forEach(line=>{
      if(line.startsWith('data:')) {
        try{
          const data = JSON.parse(line.slice(5).trim());
          if(data.text) renderCard('assistant', data.text, currentAgent);
        }catch(_){}
      }
    });

    history.push({role:'assistant', content:fullText});
  } catch(e){
    renderCard('assistant', '⚠️ Error: '+e.message, currentAgent);
  }

  streaming = false;
  document.getElementById('sendBtn').disabled = false;
}

// Init
newChat();
</script>
</body>
</html>
